name: validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLASK_CONFIG: test
    steps:
      - uses: actions/checkout@v5

      - name: Checkout taxonomy
        uses: actions/checkout@v5
        with:
          repository: NCSLI-MII/measurand-taxonomy
          path: resources/repo/measurand-taxonomy
          ref: v0.3.0-beta
          fetch-depth: 1

      - name: Checkout mlayer
        uses: actions/checkout@v5
        with:
          repository: NCSLI-MII/m-layer
          path: resources/repo/m-layer
          ref: v1.1.0
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked --all-groups

      - name: Verify requirements.txt is in sync with uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt.generated
          diff -u requirements.txt requirements.txt.generated || {
            echo "::error::requirements.txt is out of sync with uv.lock. Run 'uv export' locally and commit."
            exit 1
          }
          rm requirements.txt.generated

      - name: Security audit
        run: uv run pip-audit
        continue-on-error: true   # flip to --strict after initial triage

      - name: Run tests
        run: uv run python -m unittest discover -v

      - name: Diagnostic info (on failure)
        if: failure()
        run: |
          uv run which python
          uv pip list
          ls -la resources/repo/measurand-taxonomy || true
          ls -la resources/repo/m-layer || true

