{% extends 'base.html' %}

{% block content %}
<h1 class="title">{% block title %} Measurand: {{ measurand.name }} {% endblock %}</h1>
    <div class="content">
        <div class="measurand">
            <a href="{{ url_for('main.measurand_export_xml', measurand_id=measurand.id) }}">XML</a></td>
            <a href="{{ url_for('api.api_measurand', measurand_id=measurand.id) }}">JSON</a></td>
            </br>
            <b>Taxon:</b> {{ measurand.name }} </br>
            <b>Result:</b> <a href="/aspect/{{ measurand.aspect.id }}">{{ measurand.aspect.name }}</a></li></br>
            <b>Definition:</b> {{ measurand.definition }} </br>
            <b>Parameters: </b>: {{ measurand.parameters| join(', ') }}
        </div>
    </div>

    <div id="graph"></div>

    <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2/viz.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2/full.render.js"></script>

    <script>

    const dot = `{{ graph | safe }}`;

    const viz = new Viz();

    viz.renderSVGElement(dot)
    .then(function(element) {
        document.getElementById("graph").appendChild(element);
    })
    .catch(error => console.error(error));

    </script>

{% endblock %}
