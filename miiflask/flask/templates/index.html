{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row mb-4">

        <div class="col-md-4">

            <h5>Represented quantities</h5>

            <input class="form-control mb-2"
            id="quantitySearch"
            placeholder="Search quantities">
                <select multiple class="form-control metadata-list" id="quantityList">
                    {% for qo in quantities %}
                        <option onclick="window.location='{{ url_for('main.quantity_object_detail', aspect_id=qo.aspect_id, scale_id=qo.scale_id) }}'">{{ qo.quantity_name }}</option>
                    {% endfor %}
                </select>

        </div>

        <div class="col-md-4">

        <h5>Measurand Taxons</h5>

        <input class="form-control mb-2"
        id="measurandSearch"
        placeholder="Search taxons">
            <select multiple class="form-control metadata-list" id="measurandList">
                {% for m in measurands %}
                    <option onclick="window.location='{{ url_for('main.measurand', measurand_id=m.id) }}'">{{ m.name }}</option>
                {% endfor %}
            </select>

        </div>
    </div>

    <div class="row mt-4">


        <div class="col-md-4">
            <h5>Quantity aspects</h5>
            <input class="form-control mb-2" id="aspectSearch" placeholder="Search aspects">

            <select multiple size="15" class="form-control metadata-list" id="aspectList">
                {% for a in aspects %}
                    <option onclick="window.location='{{ url_for('main.aspect', aspect_id=a.id) }}'">{{ a.name }}</option>
                {% endfor %}
            </select>

        </div>

        <div class="col-md-4">

        <h5>Measurement Scales</h5>

        <input class="form-control mb-2"
        id="scaleSearch"
        placeholder="Search scales">

            <select multiple class="form-control metadata-list" id="scaleList">
                {% for s in scales %}
                    <option onclick="window.location='{{ url_for('main.scale', scale_id=s.id) }}'">{{ s.unit.name or s.unit.symbol }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</div>

<script>


function filterList(inputId, listId) {

    const input = document.getElementById(inputId)
    const filter = input.value.toLowerCase()
    const options = document.getElementById(listId).options

    for (let i = 0; i < options.length; i++) {

        let txt = options[i].text.toLowerCase()

        options[i].style.display =
            txt.includes(filter) ? "" : "none"
    }
}

document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("aspectSearch")
        .addEventListener("keyup", function () {
            filterList("aspectSearch", "aspectList")
        })
    
        document.getElementById("scaleSearch")
        .addEventListener("keyup", function () {
            filterList("scaleSearch", "scaleList")
        })

        document.getElementById("measurandSearch")
        .addEventListener("keyup", function () {
            filterList("measurandSearch", "measurandList")
        })
})

</script>
{% endblock %}
