# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock is in sync with pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: uv-export-requirements
        name: Export requirements.txt for legacy Ansible deployment
        entry: bash -c '{ echo "# AUTO-GENERATED by uv export from pyproject.toml + uv.lock"; echo "# DO NOT EDIT MANUALLY. Regenerate via pre-commit or:"; echo "#   uv export --format requirements-txt --no-hashes --no-dev -o requirements.txt"; echo ""; uv export --format requirements-txt --no-hashes --no-dev; } > requirements.txt'
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: requirements-txt-staged
        name: Stage regenerated requirements.txt
        entry: bash -c 'git add requirements.txt'
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        stages: [pre-commit]

